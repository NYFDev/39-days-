name: Validate aggregation and discovery

on:
  pull_request:
    paths:
      - 'aggregation/**'
      - 'assets/nyf-records.js'
      - 'data/record.schema.json'
      - 'newsletter/**'
      - 'search-index.json'
      - 'sitemap.xml'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize discovery inventory
        run: python scripts/sync_discovery.py
      - name: Build canonical public projections
        run: node aggregation/build.mjs
      - name: Audit canonical routes and public records
        run: python scripts/audit_public_site.py
      - name: Require generated files to be committed
        run: git diff --exit-code -- sitemap.xml data/records.json data/public-index.json data/public-records.json
