name: Build aggregation projections

on:
  push:
    branches:
      - main
      - agent/next-generation-aggregation
    paths:
      - 'aggregation/**'
      - '.github/workflows/build-aggregation.yml'
  pull_request:
    paths:
      - 'aggregation/**'
      - '.github/workflows/build-aggregation.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical public projections
        run: node aggregation/build.mjs
      - name: Commit generated data on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- data/; then
            echo 'Aggregation projections already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/records.json data/public-index.json
          git commit -m 'build aggregation projections'
          git push
      - name: Verify pull-request projections build
        if: github.event_name == 'pull_request'
        run: |
          test -s data/records.json
          test -s data/public-index.json
