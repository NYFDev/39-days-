name: NYF editorial collector and canonical aggregator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aggregation/**'
      - 'assets/nyf-records.js'
      - 'data/record.schema.json'
      - 'newsletter/**'
      - 'search-index.json'
      - 'sitemap.xml'
      - 'scripts/**'
      - '.github/workflows/east-corner-publisher.yml'
  schedule:
    - cron: '17 14 * * *'
    - cron: '17 15 * * *'

permissions:
  contents: write

concurrency:
  group: nyf-canonical-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect East Corner sources and publish the Morning Wire
        if: github.event_name != 'push'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NYF_EDITORIAL_QUEUE: ${{ runner.temp }}/nyf-editorial-queue.json
        run: python scripts/publish_east_corner.py

      - name: Preserve the review packet outside the public site
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nyf-editorial-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/nyf-editorial-queue.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit scheduled Morning Wire
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- newsletter/morning-wire/latest.json; then
            echo "Morning Wire unchanged."
            exit 0
          fi
          git config user.name "NYF East Corner Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter/morning-wire/latest.json
          git commit -m "Publish East Corner Morning Wire"
          git push

      - name: Synchronize canonical search and sitemap inventory
        if: github.event_name == 'push'
        run: python scripts/sync_discovery.py

      - name: Build the one schema-v2 public record projection
        if: github.event_name == 'push'
        run: node aggregation/build.mjs

      - name: Audit canonical routes, discovery, and public data
        if: github.event_name == 'push'
        run: python scripts/audit_public_site.py

      - name: Commit publisher outputs and canonical projections
        if: github.event_name == 'push'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No publisher or aggregation changes to commit."
            exit 0
          fi
          git config user.name "NYF Canonical Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add aggregation/sources newsletter feed.xml search-index.json sitemap.xml data/records.json data/public-index.json data/public-records.json
          git commit -m "Publish NYF canonical record update"
          git push
