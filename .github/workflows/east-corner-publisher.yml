name: NYF publisher and canonical aggregator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'newsletter/latest.json'
      - 'search-index.json'
      - 'scripts/aggregate_records.py'
      - 'scripts/publish_east_corner.py'
  schedule:
    - cron: '17 14 * * *'

permissions:
  contents: write

concurrency:
  group: nyf-canonical-aggregator
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish East Corner signal on manual or scheduled runs
        if: github.event_name != 'push'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/publish_east_corner.py

      - name: Normalize all known sources into canonical record layer
        run: python scripts/aggregate_records.py

      - name: Commit publisher outputs and canonical projections
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No publisher or aggregation changes to commit."
            exit 0
          fi
          git config user.name "NYF Canonical Aggregator"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter feed.xml data/records.json data/public-records.json
          git commit -m "Update canonical NYF records"
          git push
