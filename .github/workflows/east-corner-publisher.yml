name: East Corner publisher (manual fallback)

on:
  workflow_dispatch:
  # Daily publication runs through the verified source-and-route acceptance workflow.

permissions:
  contents: write

concurrency:
  group: east-corner-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish East Corner signal
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/publish_east_corner.py

      - name: Normalize into canonical record layer
        run: python scripts/aggregate_records.py

      - name: Commit published issue and canonical records
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No publisher changes to commit."
            exit 0
          fi
          git config user.name "NYF East Corner Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter feed.xml data/records.json
          git commit -m "Publish East Corner signal and normalize records"
          git push
